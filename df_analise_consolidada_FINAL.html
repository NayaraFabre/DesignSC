<!DOCTYPE html>
<!-- DF Análise Consolidada — Grupo Sá Cavalcante -->
<!-- IDENTIDADE VISUAL COMPLETA — Fases 1+2+3+4+5 -->
<html lang="pt-BR">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DF — Grupo Sá Cavalcante</title>

<!-- FASE 1: Montserrat -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- SheetJS -->
<script src="./df_analise_consolidada_files/xlsx.full.min.js.download" defer></script>
<!-- Chart.js -->
<script src="./df_analise_consolidada_files/chart.umd.min.js.download" defer></script>

<style>
/* ═══════════════════════════════════════════════════
   FASE 1 — Paleta + Tipografia
   ═══════════════════════════════════════════════════ */
:root{
  --navy:#1F3A35;
  --navy-l:#2F5848;
  --navy-d:#152B22;
  --teal:#7FC1AA;
  --orange:#F39019;
  --brown:#753D00;
  --gray-d:#1A1A1A;
  --gray-m:#6B7280;
  --gray-l:#E5E7EB;
  --gray-bg:#F5F6F8;
  --white:#fff;
  --red:#C0392B;
  --green:#1E7E4A;
  --yellow:#d69e2e;
  --blue:#2F5848;
  --font:'Montserrat','Segoe UI',system-ui,sans-serif;
  --font-weight-body:400;
  --font-weight-mid:500;
  --font-weight-semi:600;
  --font-weight-bold:700;
  --letter-spacing-heading:.4px;
  --letter-spacing-label:.6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:13px;color:var(--gray-d);background:var(--gray-bg);min-height:100vh;font-weight:var(--font-weight-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
h1,h2,h3,h4,h5,h6{font-weight:var(--font-weight-bold);letter-spacing:var(--letter-spacing-heading)}
.sec-ttl,.kpi-lbl,.fil-lbl,.chart-ttl,.alert-hdr{letter-spacing:var(--letter-spacing-label);font-weight:var(--font-weight-semi)}
.kpi-val{font-weight:var(--font-weight-bold);letter-spacing:-.5px}
.kpi-sub{font-weight:var(--font-weight-body);letter-spacing:var(--letter-spacing-label)}
thead th{letter-spacing:var(--letter-spacing-label);font-weight:var(--font-weight-semi)}

/* ═══════════════════════════════════════════════════
   FASE 2 — Header e Footer
   ═══════════════════════════════════════════════════ */
.app-hdr{background:var(--navy);color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.35);overflow:hidden}
.app-hdr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)}
.app-hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--orange) 0%,var(--teal) 55%,transparent 100%);opacity:.55}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-logomark{width:34px;height:34px;background:var(--orange);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--navy);letter-spacing:-.5px;flex-shrink:0;user-select:none}
.hdr-title-block{display:flex;flex-direction:column;gap:2px}
.app-hdr h1{font-size:14px;font-weight:700;letter-spacing:var(--letter-spacing-heading);white-space:nowrap;line-height:1.2}
.hdr-subtitle{font-size:10px;color:var(--teal);letter-spacing:.8px;text-transform:uppercase;font-weight:500;opacity:.85}
.hdr-badges{display:flex;gap:6px;flex-wrap:wrap}
.app-ftr{background:var(--navy);color:var(--teal);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid var(--navy-l);font-family:var(--font);font-size:11px;flex-wrap:wrap;gap:8px}
.ftr-brand{font-weight:700;color:#fff;letter-spacing:var(--letter-spacing-heading);font-size:11px}
.ftr-meta{color:var(--teal);font-size:10px;letter-spacing:.5px;margin-top:2px;opacity:.8}
.ftr-right{font-size:10px;color:var(--teal);letter-spacing:.3px;text-align:right;opacity:.8;line-height:1.7}

/* ═══════════════════════════════════════════════════
   FASE 3 — Botões e Badges
   ═══════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 20px;border-radius:6px;border:none;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:var(--font-weight-semi);letter-spacing:.3px;transition:background .18s,box-shadow .18s,color .18s,border-color .18s;white-space:nowrap}
.btn-pri{background:var(--orange);color:#fff;box-shadow:0 1px 4px rgba(243,144,25,.35)}
.btn-pri:hover{background:#d97d0e;box-shadow:0 2px 8px rgba(243,144,25,.45)}
.btn-pri:active{background:#bf6e0c;box-shadow:none;transform:translateY(1px)}
.btn-pri:disabled{background:var(--gray-m);box-shadow:none;cursor:not-allowed;opacity:.65}
.btn-sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn-sec:hover{background:var(--navy);color:#fff}
.btn-sec:active{background:var(--navy-d);color:#fff}
.btn-grn{background:var(--navy-l);color:#fff;box-shadow:0 1px 4px rgba(47,88,72,.3)}
.btn-grn:hover{background:var(--navy);box-shadow:0 2px 6px rgba(47,88,72,.4)}
.btn-grn:active{background:var(--navy-d)}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--gray-l)}
.btn-ghost:hover{border-color:var(--navy);color:var(--navy);background:rgba(31,58,53,.05)}
.btn-sm{padding:5px 13px;font-size:11px}
.btn-lg{padding:11px 24px;font-size:13px}
.btn-reconect{background:rgba(127,193,170,.12);color:var(--navy);border:1.5px solid var(--teal);font-size:12px;font-weight:var(--font-weight-semi);letter-spacing:.3px}
.btn-reconect:hover{background:rgba(127,193,170,.25);border-color:var(--navy-l)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.5px;line-height:1.5;white-space:nowrap}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge-ok{background:#DCF5E7;color:#145A32;border:1px solid rgba(20,90,50,.25)}
.badge-ok .badge-dot{background:#1E7E4A}
.badge-err{background:#FDECEA;color:#922B21;border:1px solid rgba(146,43,33,.25)}
.badge-err .badge-dot{background:#C0392B}
.badge-wrn{background:#FEF3DC;color:#7D4A00;border:1px solid rgba(125,74,0,.25)}
.badge-wrn .badge-dot{background:#F39019}
.badge-inf{background:#EAF4FB;color:#154360;border:1px solid rgba(21,67,96,.2)}
.badge-inf .badge-dot{background:#2980B9}
.badge-navy{background:rgba(31,58,53,.1);color:var(--navy);border:1px solid rgba(31,58,53,.2);font-weight:700}
.fl-nm{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;background:rgba(243,144,25,.15);color:#7D4A00;margin-left:4px;letter-spacing:.3px}
.fl-al{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;background:rgba(192,57,43,.12);color:#922B21;margin-left:4px;letter-spacing:.3px}
.orig-badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;margin-left:4px;vertical-align:middle;letter-spacing:.3px}
.orig-bal{background:rgba(31,58,53,.1);color:var(--navy)}
.orig-est{background:rgba(30,126,74,.12);color:#145A32}

/* ═══════════════════════════════════════════════════
   FASE 4 — Abas e Navegação
   ═══════════════════════════════════════════════════ */
.tabs-nav{background:#fff;border-bottom:2px solid var(--gray-l);padding:0 24px;display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
.tabs-nav::-webkit-scrollbar{display:none}
.tab-btn{padding:12px 20px;border:none;background:none;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:var(--font-weight-mid);color:var(--gray-m);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;letter-spacing:var(--letter-spacing-label);transition:color .15s,border-color .15s,background .15s;border-radius:6px 6px 0 0;display:inline-flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--navy);background:rgba(31,58,53,.04)}
.tab-btn.on{color:var(--navy);border-bottom-color:var(--orange);font-weight:var(--font-weight-bold);background:rgba(31,58,53,.03)}
.tab-count{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--gray-l);color:var(--gray-m);font-size:9px;font-weight:700;transition:background .15s,color .15s;flex-shrink:0}
.tab-btn.on .tab-count{background:var(--orange);color:#fff}
.tab-pane{display:none;padding:22px 24px}
.tab-pane.on{display:block}
#tab-conf.on{padding:0}
.conf-tabs{background:var(--gray-bg);border-bottom:1px solid var(--gray-l);padding:0 24px;display:flex;gap:2px;position:sticky;top:64px;z-index:85}
.conf-tab-btn{padding:9px 16px;border:none;background:none;cursor:pointer;font-family:var(--font);font-size:11px;font-weight:var(--font-weight-mid);color:var(--gray-m);letter-spacing:var(--letter-spacing-label);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s,background .15s;border-radius:4px 4px 0 0}
.conf-tab-btn:hover{color:var(--navy);background:rgba(31,58,53,.05)}
.conf-tab-btn.on{color:var(--navy);border-bottom-color:var(--teal);font-weight:700;background:rgba(127,193,170,.08)}
.conf-sub-pane{display:none;padding:22px 24px}
.conf-sub-pane.on{display:block}
.fil-bar{background:#fff;border-bottom:1px solid var(--gray-l);padding:8px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:64px;z-index:90}
.fil-grp{display:flex;align-items:center;gap:6px}
.fil-lbl{font-size:10px;font-weight:var(--font-weight-bold);color:var(--gray-m);text-transform:uppercase;letter-spacing:var(--letter-spacing-label);white-space:nowrap}
select{border:1.5px solid var(--gray-l);border-radius:6px;padding:5px 10px;font-size:12px;font-family:var(--font);font-weight:var(--font-weight-mid);color:var(--gray-d);background:#fff;cursor:pointer;outline:none;transition:border-color .2s}
select:focus{border-color:var(--navy)}
select:hover{border-color:var(--gray-m)}
.tog{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1.5px solid var(--gray-l);background:#fff;cursor:pointer;font-family:var(--font);font-size:11px;font-weight:var(--font-weight-semi);color:var(--gray-m);letter-spacing:.3px;transition:all .15s}
.tog:hover{border-color:var(--navy);color:var(--navy)}
.tog.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dre-yr-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dre-yr-lbl{font-size:10px;font-weight:var(--font-weight-bold);color:var(--gray-m);text-transform:uppercase;letter-spacing:var(--letter-spacing-label);margin-right:4px}
.yr-pill{padding:4px 13px;border-radius:20px;border:1.5px solid var(--gray-l);background:#fff;cursor:pointer;font-family:var(--font);font-size:11px;font-weight:var(--font-weight-semi);color:var(--gray-m);transition:all .15s}
.yr-pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.yr-pill:hover:not(.on){border-color:var(--navy);color:var(--navy)}
.bp-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--gray-l);background:#fafbfc;flex-wrap:wrap;gap:10px}
.dre-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--gray-l);background:#fafbfc;flex-wrap:wrap;gap:10px}
.dre-xpnd{display:inline-flex;align-items:center;justify-content:center;width:16px;cursor:pointer;color:var(--gray-m);font-size:10px;margin-right:4px;transition:color .15s}
.dre-xpnd:hover{color:var(--navy)}

/* ═══════════════════════════════════════════════════
   FASE 5 — Tabelas e Cards
   ═══════════════════════════════════════════════════ */

/* ── KPI Cards ────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{
  background:#fff;
  border-radius:10px;
  padding:16px 18px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  border-top:3px solid var(--orange);
  border-left:none;
  position:relative;
  overflow:hidden;
  transition:box-shadow .2s;
}
.kpi::after{
  content:'';
  position:absolute;
  bottom:-18px;right:-12px;
  width:60px;height:60px;
  border-radius:50%;
  background:currentColor;
  opacity:.04;
}
.kpi:hover{box-shadow:0 3px 10px rgba(0,0,0,.1)}
.kpi.r{border-top-color:var(--red);color:var(--red)}
.kpi.g{border-top-color:var(--green);color:var(--green)}
.kpi.o{border-top-color:var(--orange);color:var(--orange)}
.kpi-lbl{font-size:10px;color:var(--gray-m);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;font-weight:600}
.kpi-val{font-size:22px;font-weight:700;color:var(--gray-d);line-height:1.1;letter-spacing:-.5px}
.kpi-sub{font-size:11px;color:var(--gray-m);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
/* Badge de tendência dentro do KPI */
.kpi-trend{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.2px}
.kpi-trend.up{background:#DCF5E7;color:#145A32}
.kpi-trend.dn{background:#FDECEA;color:#922B21}

/* ── Section cards ────────────────────────────────── */
.sec{
  background:#fff;
  border-radius:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  margin-bottom:18px;
  overflow:hidden;
  border:1px solid rgba(31,58,53,.06);
}
.sec-hdr{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 18px;
  border-bottom:1px solid var(--gray-l);
  background:#FAFBFA;
}
.sec-hdr-inner{display:flex;align-items:center}
/* Acento laranja vertical no título da seção */
.sec-hdr-accent{
  width:3px;height:16px;
  background:var(--orange);
  border-radius:2px;
  margin-right:10px;
  flex-shrink:0;
}
.sec-ttl{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:var(--letter-spacing-heading)}
.sec-body{padding:0}
.sec-body.p{padding:14px 18px}

/* ── Tabelas ──────────────────────────────────────── */
/* Wrapper com borda e radius */
.tbl-wrap{
  overflow-x:auto;
  max-height:520px;
  overflow-y:auto;
  border-radius:8px;
  border:1px solid var(--gray-l);
}
/* Dentro de .sec, sem borda dupla */
.sec .tbl-wrap{border-radius:0;border:none}

table{width:100%;border-collapse:collapse;font-size:12px}

thead th{
  background:var(--navy);
  color:#fff;
  padding:10px 13px;
  text-align:left;
  font-family:var(--font);
  font-weight:var(--font-weight-semi);
  white-space:nowrap;
  position:sticky;
  top:0;
  cursor:pointer;
  user-select:none;
  letter-spacing:.5px;
  font-size:11px;
}
thead th:first-child{padding-left:16px}
thead th.num{text-align:right}
thead th:hover{background:var(--navy-l)}

tbody tr{border-bottom:1px solid var(--gray-l);transition:background .12s}
tbody tr:hover{background:#EEF4F2}
/* Zebra sutil nas linhas pares — facilita leitura em DREs longas */
tbody tr:nth-child(even):not(.t0):not(.t1):not(.tr-tot):not(.tr-hl):not(.tr-sub):not(.tr-sec){
  background:#FAFBFA;
}
tbody tr:nth-child(even):hover{background:#EEF4F2!important}

tbody td{padding:8px 13px;font-family:var(--font)}
tbody td:first-child{padding-left:16px}

/* ── Linhas de hierarquia ─────────────────────────── */
.t0{
  font-weight:700;
  font-size:12px;
  background:#E8EFF0!important;
  color:var(--navy-d);
}
.t0 td:first-child{border-left:3px solid var(--navy)}

.t1{font-weight:600;background:#F3F7F6!important}
.t1 td:first-child{padding-left:22px!important;border-left:2px solid var(--teal)}

.t2 td:first-child{padding-left:38px!important}

.t3{color:var(--gray-m);font-size:11px}
.t3 td:first-child{padding-left:54px!important}

/* ── Linhas de totais ─────────────────────────────── */
.tr-sub{background:#DDE8E6!important;font-weight:600;color:var(--navy)}
.tr-tot{background:var(--navy)!important;color:#fff!important;font-weight:700}
.tr-tot td{color:#fff!important;letter-spacing:.3px}
.tr-hl{background:var(--navy-d)!important;color:#fff!important;font-weight:700}
.tr-hl td{color:#fff!important}
.tr-sec{background:#EAF0EF!important;font-weight:700;color:var(--navy)}

/* ── Numérico ─────────────────────────────────────── */
.num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--green);font-weight:600}
.neg{color:var(--red);font-weight:600}
.cell-red{background:rgba(192,57,43,.1)!important;color:var(--red);font-weight:600}
.cell-org{background:rgba(243,144,25,.1)!important;color:#7D4A00}
.cell-gry{color:#a0aec0}

/* ── Controles de tabela ──────────────────────────── */
.tbl-ctrl{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--gray-l);gap:10px;flex-wrap:wrap}
.srch{border:1.5px solid var(--gray-l);border-radius:6px;padding:5px 9px;font-size:12px;font-family:var(--font);width:200px;outline:none;transition:border-color .2s}
.srch:focus{border-color:var(--navy)}
.srch:hover{border-color:var(--gray-m)}

/* ── Alert items ──────────────────────────────────── */
.alert-panel{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:18px;border:1px solid rgba(31,58,53,.06)}
.alert-hdr{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px;letter-spacing:var(--letter-spacing-heading)}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:6px;margin-bottom:6px;font-size:12px;border:1px solid transparent}
.alert-item:last-child{margin-bottom:0}
.a-err{background:#FFF5F5;border-color:rgba(192,57,43,.2);border-left:3px solid var(--red)}
.a-wrn{background:#FFFBF0;border-color:rgba(243,144,25,.2);border-left:3px solid var(--orange)}
.a-ok{background:#F0FFF6;border-color:rgba(30,126,74,.2);border-left:3px solid var(--green)}
.a-ico{font-size:13px;flex-shrink:0;margin-top:1px}

/* ── Chart cards ──────────────────────────────────── */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px;margin-bottom:20px}
.chart-card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.07);border:1px solid rgba(31,58,53,.06)}
.chart-ttl{font-size:12px;font-weight:600;color:var(--gray-d);margin-bottom:12px;letter-spacing:var(--letter-spacing-label)}
.chart-box{position:relative;height:210px}

/* ── Loading overlay ──────────────────────────────── */
.loading-ov{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loading-ov.on{display:flex}
.spinner{width:38px;height:38px;border:4px solid var(--gray-l);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:14px;color:var(--gray-d);font-weight:500}
.load-sub{font-size:12px;color:var(--gray-m)}

/* ── Empty state ──────────────────────────────────── */
.empty{text-align:center;padding:36px 20px;color:var(--gray-m)}
.empty-ico{font-size:36px;margin-bottom:10px}

/* ── Scrollbar ────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--gray-bg)}
::-webkit-scrollbar-thumb{background:var(--gray-m);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--navy)}

/* ── DRE detalhes ─────────────────────────────────── */
.dre-det td{background:#f9fafb!important;font-size:11px!important}
.dre-det:last-child{border-bottom:1px solid var(--gray-l)!important}
.dre-marg{color:var(--gray-m);font-size:11px;min-width:60px}
.dre-var.pos{color:var(--green);font-weight:600}
.dre-var.neg{color:var(--red);font-weight:600}
td.dre-marg.pos{color:var(--green)}
td.dre-marg.neg{color:var(--red)}

/* ── Gauge ────────────────────────────────────────── */
.gauge-bar{flex:1;height:7px;background:var(--gray-l);border-radius:4px;overflow:hidden}
.gauge-fill{height:100%;border-radius:4px;transition:width .5s}

/* ═══════════════════════════════════════════════════
   CSS original preservado (sem alterações)
   ═══════════════════════════════════════════════════ */
#upload-screen{max-width:820px;margin:40px auto;padding:0 24px}
.up-card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:20px}
.up-card h2{font-size:17px;color:var(--navy);margin-bottom:24px;padding-bottom:14px;border-bottom:2px solid var(--navy)}
.up-step{display:flex;align-items:flex-start;gap:14px;padding:14px;border:2px dashed var(--gray-l);border-radius:8px;margin-bottom:12px;cursor:default!important;transition:all .2s}
.up-step:hover{border-color:var(--gray-l)!important;background:inherit!important}
.up-step.ok{border-color:var(--green);border-style:solid;background:#f0fff4}
.up-step.ok:hover{border-color:var(--green)!important;background:#f0fff4!important}
.step-num{width:30px;height:30px;background:var(--navy);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;margin-top:2px}
.step-body{flex:1}
.step-body h3{font-size:13px;margin-bottom:3px}
.step-body p{font-size:11px;color:var(--gray-m)}
.step-ok{font-size:11px;color:var(--green);margin-top:5px;font-weight:600}
.step-ico{font-size:22px;color:var(--gray-m)}
input[type=file]{display:none}
.legend-box{background:#f7fafc;border:1px solid var(--gray-l);border-radius:6px;padding:10px 14px;font-size:11px;color:var(--gray-m);margin-bottom:16px;line-height:1.7}
.legend-box strong{color:var(--gray-d)}
.step-path{font-size:10px;color:var(--teal);margin-top:5px;word-break:break-all;font-family:monospace;line-height:1.5;min-height:14px}
.step-hint{font-size:10px;color:#aab;margin-top:3px;font-style:italic}
.step-actions{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;min-width:150px}
.btn-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.upd-status{font-size:10px;min-height:13px;text-align:right}
.upd-ok{color:var(--green);font-weight:600}
.upd-wrn{color:var(--orange);font-weight:600}
.upd-err{color:var(--red);font-weight:600}
.upd-inf{color:var(--gray-m)}
.p27-zero{background:#fdecea;color:var(--red);font-weight:700}
.p27-ok{background:#f0fff4}
.p27-yr-hdr{background:var(--navy);color:#fff;font-weight:700;font-size:12px}
.p27-subtotal{background:#eef2f7;font-weight:700;border-top:2px solid var(--navy-l)}
.p27-alert-warn{margin:10px 0;padding:10px 14px;background:#fdecea;border-left:4px solid var(--red);border-radius:4px;font-size:12px;color:#7b1d1d}
.p27-alert-ok{margin:10px 0;padding:10px 14px;background:#f0fff4;border-left:4px solid var(--green);border-radius:4px;font-size:12px;color:#1a4731}

/* ── Responsivo ───────────────────────────────────── */
@media(max-width:480px){
  .hdr-subtitle{display:none}
  .hdr-logomark{width:28px;height:28px;font-size:11px}
  .app-hdr h1{font-size:13px}
  .app-hdr{padding:0 16px}
  .app-ftr{padding:10px 16px;flex-direction:column;gap:4px}
  .ftr-right{text-align:left}
  .tab-btn{padding:10px 14px;font-size:11px}
}
@media(max-width:768px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
  .fil-bar{padding:6px 12px}
  .tab-pane{padding:14px}
}
@media print{
  .fil-bar,.tabs-nav,.app-hdr,.app-ftr,.conf-tabs{display:none!important}
  .tab-pane,.conf-sub-pane{display:block!important}
  .sec{box-shadow:none;border:1px solid #ddd}
  .tbl-wrap{max-height:none;overflow:visible}
}
